# AulaIA: entorno local reproducible con Docker Compose.
# Copia primero .env.example a .env y reemplaza los valores CHANGE_ME.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB debe estar definido en .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER debe estar definido en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definido en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aulaia_network

  data-science:
    build:
      context: ./data-science
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DATA_SCIENCE_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: docker
      PORT: 8000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aulaia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB debe estar definido en .env}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER debe estar definido en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definido en .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe estar definido en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      IA_SERVICE_URL: http://data-science:8000
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: 8080
      APP_DEMO_USERS_ENABLED: ${APP_DEMO_USERS_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_POLLING_INTERVAL_MS: ${TELEGRAM_POLLING_INTERVAL_MS:-3000}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aulaia_network
    depends_on:
      postgres:
        condition: service_healthy
      data-science:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - aulaia_network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  aulaia_network:
    driver: bridge
