<app-page-header 
  [title]="isEdit() ? 'Editar Horario' : 'Nuevo Horario'">
</app-page-header>

<div class="bg-surface rounded-xl shadow-sm border border-outline-variant mt-6 p-6 max-w-4xl">
  
  <div *ngIf="loading() && isEdit()" class="text-center py-8 text-on-surface-variant">
    Cargando datos del horario...
  </div>

  <form *ngIf="!(loading() && isEdit())" [formGroup]="form" (ngSubmit)="guardar()" class="space-y-6">
    
    <!-- Relaciones (Curso, Sección, Docente) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Curso -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Curso *</label>
        <select formControlName="cursoId" class="input-text w-full"
                [class.border-error]="form.get('cursoId')?.invalid && form.get('cursoId')?.touched">
          <option value="" disabled>Selecciona un curso</option>
          <option *ngFor="let curso of cursos()" [value]="curso.id">{{ curso.nombre }}</option>
        </select>
        <div *ngIf="form.get('cursoId')?.invalid && form.get('cursoId')?.touched" class="text-error text-xs mt-1">
          Requerido.
        </div>
      </div>

      <!-- Sección -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Sección *</label>
        <select formControlName="seccionId" class="input-text w-full"
                [class.border-error]="form.get('seccionId')?.invalid && form.get('seccionId')?.touched">
          <option value="" disabled>Selecciona una sección</option>
          <option *ngFor="let seccion of secciones()" [value]="seccion.id">
            {{ seccion.grado.nombre }} — Sección {{ seccion.nombre }}
          </option>
        </select>
        <div *ngIf="form.get('seccionId')?.invalid && form.get('seccionId')?.touched" class="text-error text-xs mt-1">
          Requerido.
        </div>
      </div>

      <!-- Docente -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Docente *</label>
        <select formControlName="docenteId" class="input-text w-full"
                [class.border-error]="form.get('docenteId')?.invalid && form.get('docenteId')?.touched">
          <option value="" disabled>Selecciona un docente</option>
          <option *ngFor="let docente of docentes()" [value]="docente.id">
            {{ docente.apellidos }}, {{ docente.nombres }}
          </option>
        </select>
        <div *ngIf="form.get('docenteId')?.invalid && form.get('docenteId')?.touched" class="text-error text-xs mt-1">
          Requerido.
        </div>
      </div>
    </div>

    <!-- Tiempos (Día, Hora Inicio, Hora Fin) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 border-t border-outline-variant pt-6">
      
      <!-- Día Semana -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Día de la semana *</label>
        <select formControlName="diaSemana" class="input-text w-full"
                [class.border-error]="form.get('diaSemana')?.invalid && form.get('diaSemana')?.touched">
          <option value="" disabled>Selecciona el día</option>
          <option *ngFor="let dia of diasSemana" [value]="dia.id">{{ dia.nombre }}</option>
        </select>
        <div *ngIf="form.get('diaSemana')?.invalid && form.get('diaSemana')?.touched" class="text-error text-xs mt-1">
          Requerido.
        </div>
      </div>

      <!-- Hora Inicio -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Hora Inicio *</label>
        <input type="time" formControlName="horaInicio" class="input-text w-full"
          [class.border-error]="form.get('horaInicio')?.invalid && form.get('horaInicio')?.touched">
        <div *ngIf="form.get('horaInicio')?.invalid && form.get('horaInicio')?.touched" class="text-error text-xs mt-1">
          Requerido.
        </div>
      </div>

      <!-- Hora Fin -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Hora Fin *</label>
        <input type="time" formControlName="horaFin" class="input-text w-full"
          [class.border-error]="form.get('horaFin')?.invalid && form.get('horaFin')?.touched">
        <div *ngIf="form.get('horaFin')?.invalid && form.get('horaFin')?.touched" class="text-error text-xs mt-1">
          Requerido.
        </div>
      </div>
    </div>

    <!-- Configuraciones (Tolerancia, Apertura) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-t border-outline-variant pt-6">
      
      <!-- Tolerancia -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Tolerancia de llegada (Minutos) *</label>
        <input type="number" min="0" formControlName="toleranciaMinutos" class="input-text w-full"
          [class.border-error]="form.get('toleranciaMinutos')?.invalid && form.get('toleranciaMinutos')?.touched">
        <div *ngIf="form.get('toleranciaMinutos')?.invalid && form.get('toleranciaMinutos')?.touched" class="text-error text-xs mt-1">
          Requerido (Mínimo 0).
        </div>
      </div>

      <!-- Apertura -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Apertura previa de sesión (Minutos) *</label>
        <input type="number" min="0" formControlName="minutosAntesApertura" class="input-text w-full"
          [class.border-error]="form.get('minutosAntesApertura')?.invalid && form.get('minutosAntesApertura')?.touched">
        <div *ngIf="form.get('minutosAntesApertura')?.invalid && form.get('minutosAntesApertura')?.touched" class="text-error text-xs mt-1">
          Requerido (Mínimo 0).
        </div>
      </div>
    </div>

    <div class="pt-4 flex justify-end gap-3 border-t border-outline-variant mt-6">
      <button type="button" class="btn btn-secondary" routerLink="/admin/horarios">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        {{ loading() ? 'Guardando...' : 'Guardar Horario' }}
      </button>
    </div>

  </form>

</div>
