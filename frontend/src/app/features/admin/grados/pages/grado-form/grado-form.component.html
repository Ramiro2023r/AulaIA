<app-page-header 
  [title]="isEdit() ? 'Editar Grado' : 'Nuevo Grado'">
</app-page-header>

<div class="bg-surface rounded-xl shadow-sm border border-outline-variant mt-6 p-6 max-w-3xl">
  
  <div *ngIf="loading() && isEdit()" class="text-center py-8 text-on-surface-variant">
    Cargando datos del grado...
  </div>

  <form *ngIf="!(loading() && isEdit())" [formGroup]="form" (ngSubmit)="guardar()" class="space-y-6">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Nombre del Grado *</label>
        <input type="text" formControlName="nombre" class="input-text w-full" placeholder="Ej: Primero A"
          [class.border-error]="form.get('nombre')?.invalid && form.get('nombre')?.touched">
        <div *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="text-error text-xs mt-1">
          El nombre es requerido y máximo 50 caracteres.
        </div>
      </div>

      <!-- Nivel -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Nivel Educativo *</label>
        <select formControlName="nivel" class="input-text w-full"
          [class.border-error]="form.get('nivel')?.invalid && form.get('nivel')?.touched">
          <option value="">Seleccione un nivel...</option>
          <option value="Primaria">Primaria</option>
          <option value="Secundaria">Secundaria</option>
        </select>
        <div *ngIf="form.get('nivel')?.invalid && form.get('nivel')?.touched" class="text-error text-xs mt-1">
          El nivel es requerido.
        </div>
      </div>

      <!-- Orden -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Orden (Secuencia) *</label>
        <input type="number" formControlName="orden" class="input-text w-full" placeholder="1" min="1"
          [class.border-error]="form.get('orden')?.invalid && form.get('orden')?.touched">
        <div *ngIf="form.get('orden')?.invalid && form.get('orden')?.touched" class="text-error text-xs mt-1">
          El orden debe ser mayor a 0.
        </div>
      </div>
      
    </div>

    <div class="pt-4 flex justify-end gap-3 border-t border-outline-variant mt-6">
      <button type="button" class="btn btn-secondary" routerLink="/admin/grados">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        {{ loading() ? 'Guardando...' : 'Guardar Grado' }}
      </button>
    </div>

  </form>

</div>
