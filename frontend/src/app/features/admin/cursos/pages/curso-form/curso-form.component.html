<app-page-header 
  [title]="isEdit() ? 'Editar Curso' : 'Nuevo Curso'">
</app-page-header>

<div class="bg-surface rounded-xl shadow-sm border border-outline-variant mt-6 p-6 max-w-3xl">
  
  <div *ngIf="loading() && isEdit()" class="text-center py-8 text-on-surface-variant">
    Cargando datos del curso...
  </div>

  <form *ngIf="!(loading() && isEdit())" [formGroup]="form" (ngSubmit)="guardar()" class="space-y-6">
    
    <div class="grid grid-cols-1 gap-6">
      
      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Nombre del Curso *</label>
        <input type="text" formControlName="nombre" class="input-text w-full" placeholder="Ej: Matemáticas"
          [class.border-error]="form.get('nombre')?.invalid && form.get('nombre')?.touched">
        <div *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="text-error text-xs mt-1">
          El nombre es requerido y máximo 100 caracteres.
        </div>
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Descripción</label>
        <textarea formControlName="descripcion" class="input-text w-full min-h-[100px] resize-y" placeholder="Breve descripción del curso..."
          [class.border-error]="form.get('descripcion')?.invalid && form.get('descripcion')?.touched"></textarea>
        <div *ngIf="form.get('descripcion')?.invalid && form.get('descripcion')?.touched" class="text-error text-xs mt-1">
          La descripción tiene un máximo de 255 caracteres.
        </div>
      </div>
      
    </div>

    <div class="pt-4 flex justify-end gap-3 border-t border-outline-variant mt-6">
      <button type="button" class="btn btn-secondary" routerLink="/admin/cursos">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        {{ loading() ? 'Guardando...' : 'Guardar Curso' }}
      </button>
    </div>

  </form>

</div>
