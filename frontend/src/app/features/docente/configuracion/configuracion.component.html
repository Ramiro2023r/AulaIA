<app-page-header title="Configuración de Perfil"></app-page-header>

<div class="max-w-3xl mx-auto mt-6">
  <div class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden animate-fade-in">
    <div class="p-6 border-b border-outline-variant">
      <h2 class="text-xl font-headline-sm text-on-surface mb-2">Datos Personales</h2>
      <p class="text-body-md text-on-surface-variant">Actualiza tu información de contacto y tu biografía pública.</p>
    </div>

    <div *ngIf="isLoading()" class="p-6 space-y-6">
      <div class="space-y-2">
        <app-skeleton class="h-5 w-32"></app-skeleton>
        <app-skeleton class="h-11 w-full"></app-skeleton>
      </div>
      <div class="space-y-2">
        <app-skeleton class="h-5 w-32"></app-skeleton>
        <app-skeleton class="h-11 w-full"></app-skeleton>
      </div>
      <div class="space-y-2">
        <app-skeleton class="h-5 w-32"></app-skeleton>
        <app-skeleton class="h-24 w-full"></app-skeleton>
      </div>
    </div>

    <form *ngIf="!isLoading()" [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="p-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Correo Alternativo -->
        <div class="space-y-1">
          <label class="block text-sm font-medium text-on-surface">Correo Electrónico Alternativo</label>
          <input 
            type="email" 
            formControlName="correoAlternativo"
            placeholder="ej. juan@gmail.com"
            class="w-full h-11 px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
            [ngClass]="{'border-error focus:ring-error': profileForm.get('correoAlternativo')?.invalid && profileForm.get('correoAlternativo')?.touched}"
          >
          <div *ngIf="profileForm.get('correoAlternativo')?.invalid && profileForm.get('correoAlternativo')?.touched" class="text-error text-xs mt-1">
            <span *ngIf="profileForm.get('correoAlternativo')?.errors?.['email']">Debe ser un correo válido.</span>
            <span *ngIf="profileForm.get('correoAlternativo')?.errors?.['maxlength']">No puede exceder los 100 caracteres.</span>
          </div>
        </div>

        <!-- Teléfono -->
        <div class="space-y-1">
          <label class="block text-sm font-medium text-on-surface">Teléfono</label>
          <input 
            type="tel" 
            formControlName="telefono"
            placeholder="ej. +123456789"
            class="w-full h-11 px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
            [ngClass]="{'border-error focus:ring-error': profileForm.get('telefono')?.invalid && profileForm.get('telefono')?.touched}"
          >
          <div *ngIf="profileForm.get('telefono')?.invalid && profileForm.get('telefono')?.touched" class="text-error text-xs mt-1">
            <span *ngIf="profileForm.get('telefono')?.errors?.['maxlength']">No puede exceder los 20 caracteres.</span>
          </div>
        </div>
      </div>

      <!-- Biografía -->
      <div class="space-y-1">
        <label class="block text-sm font-medium text-on-surface">Biografía Corta</label>
        <textarea 
          formControlName="biografia"
          rows="4"
          placeholder="Escribe una breve descripción sobre ti y tu experiencia..."
          class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all resize-y"
          [ngClass]="{'border-error focus:ring-error': profileForm.get('biografia')?.invalid && profileForm.get('biografia')?.touched}"
        ></textarea>
        <div class="flex justify-between mt-1">
          <div class="text-error text-xs">
            <span *ngIf="profileForm.get('biografia')?.invalid && profileForm.get('biografia')?.touched && profileForm.get('biografia')?.errors?.['maxlength']">
              No puede exceder los 500 caracteres.
            </span>
          </div>
          <div class="text-xs text-on-surface-variant">
            {{ profileForm.get('biografia')?.value?.length || 0 }} / 500
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="pt-4 border-t border-outline-variant flex justify-end">
        <app-button 
          type="submit" 
          variant="primary" 
          [disabled]="profileForm.invalid || profileForm.pristine || isSaving()"
          [loading]="isSaving()"
        >
          Guardar Cambios
        </app-button>
      </div>
    </form>
  </div>
</div>
