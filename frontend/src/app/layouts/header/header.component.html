<header class="flex justify-between items-center w-full px-lg h-16 sticky top-0 z-40 bg-surface border-b border-outline-variant shadow-sm">
  
  <!-- Mobile: hamburger + logo -->
  <div class="flex items-center gap-md md:hidden">
    <button
      class="text-on-surface-variant cursor-pointer active:opacity-80 min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl hover:bg-surface-variant"
      (click)="toggleMenu()"
      aria-label="Abrir menú"
    >
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">AulaIA</div>
  </div>

  <!-- Desktop: page title -->
  <div class="hidden md:block">
    <h2 class="font-headline-md text-headline-md text-on-surface">{{ pageTitle }}</h2>
  </div>

  <!-- Actions -->
  <div class="flex items-center gap-sm">
    <!-- Search (desktop) -->
    <div class="relative hidden md:block w-64">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
      <input
        type="text"
        placeholder="Buscar..."
        class="w-full pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary h-[44px]"
      />
    </div>

    <!-- Notifications -->
    <button
      class="text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer active:opacity-80 rounded-full min-h-[44px] min-w-[44px] flex items-center justify-center"
      aria-label="Notificaciones"
    >
      <span class="material-symbols-outlined">notifications</span>
    </button>

    <!-- Help -->
    <button
      class="text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer active:opacity-80 rounded-full min-h-[44px] min-w-[44px] hidden md:flex items-center justify-center"
      aria-label="Ayuda"
    >
      <span class="material-symbols-outlined">help</span>
    </button>

    <!-- Profile -->
    <button
      class="text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer active:opacity-80 rounded-full min-h-[44px] min-w-[44px] flex items-center justify-center"
      aria-label="Perfil"
    >
      <span class="material-symbols-outlined">account_circle</span>
    </button>
  </div>
</header>
