@if (isOpen) {
  <div
    class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title ? 'modal-title' : null"
    (click)="onBackdropClick($event)"
  >
    <div
      class="w-full bg-surface rounded-2xl shadow-2xl border border-outline-variant flex flex-col max-h-[90vh]"
      [ngClass]="panelWidth"
    >
      <!-- Header -->
      <div class="flex items-center justify-between px-lg py-md border-b border-outline-variant flex-shrink-0">
        <h2 id="modal-title" class="text-headline-md font-semibold text-on-surface">{{ title }}</h2>
        <button
          (click)="close()"
          class="w-9 h-9 flex items-center justify-center rounded-xl text-on-surface-variant hover:bg-surface-variant transition-colors"
          aria-label="Cerrar"
        >
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>

      <!-- Body -->
      <div class="p-lg flex-1 overflow-y-auto">
        <ng-content></ng-content>
      </div>

      <!-- Footer -->
      <div class="px-lg py-md border-t border-outline-variant flex items-center justify-end gap-3 flex-shrink-0 empty:hidden">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
