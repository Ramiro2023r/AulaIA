<div class="flex flex-col items-center justify-center p-xl text-center">
  <div class="w-16 h-16 rounded-full bg-surface-variant flex items-center justify-center mb-4 text-primary">
    <span class="material-symbols-outlined text-[32px]">{{ icon }}</span>
  </div>
  <h3 class="text-headline-md font-semibold text-on-surface mb-2">{{ title }}</h3>
  <p *ngIf="description" class="text-body-md text-on-surface-variant max-w-md mx-auto mb-6">{{ description }}</p>
  <ng-content></ng-content>
</div>
