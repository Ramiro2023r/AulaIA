<div class="flex flex-col gap-1 w-full">
  <label *ngIf="label" class="text-label-md text-on-surface-variant mb-1 font-semibold">{{ label }}</label>
  
  <div class="relative flex items-center">
    <span *ngIf="icon" class="material-symbols-outlined absolute left-3 text-outline text-[20px] z-10">{{ icon }}</span>
    
    <select
      [disabled]="disabled"
      [value]="value"
      (change)="onChangeEvent($event)"
      (blur)="onBlur()"
      [class.pl-10]="icon"
      [class.border-error]="error"
      [class.focus:ring-error]="error"
      class="w-full h-11 px-3 py-2 bg-surface text-on-surface border border-outline-variant rounded-lg appearance-none
             focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent 
             disabled:bg-surface-variant disabled:text-outline disabled:cursor-not-allowed
             font-body-md transition-colors cursor-pointer"
      [attr.aria-invalid]="!!error"
    >
      <option *ngIf="placeholder" value="" disabled selected hidden>{{ placeholder }}</option>
      <option *ngFor="let opt of options" [value]="opt.value">{{ opt.label }}</option>
    </select>
    
    <span class="material-symbols-outlined absolute right-3 text-outline text-[20px] pointer-events-none">expand_more</span>
  </div>

  <span *ngIf="error" class="text-label-sm text-error mt-1 flex items-center">
    <span class="material-symbols-outlined text-[14px] mr-1">error</span>
    {{ error }}
  </span>
  
  <span *ngIf="helperText && !error" class="text-label-sm text-on-surface-variant mt-1">{{ helperText }}</span>
</div>
