<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>

<title>AulaIA - Asistencia Registrada</title>

<style>
        /* Base styles to ensure consistency */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Subtle entrance animation for the card */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-entrance {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Pop animation for the checkmark */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen w-full flex items-center justify-center p-md sm:p-lg md:p-xl relative overflow-hidden">
<!-- Decorative ambient background elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary-container opacity-20 blur-3xl"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary-fixed-dim opacity-30 blur-3xl"></div>
</div>
<!-- Main Confirmation Card -->
<main class="w-full max-w-md bg-surface rounded-xl shadow-lg border border-outline-variant/30 flex flex-col items-center text-center relative z-10 animate-entrance overflow-hidden">
<!-- Header Color Bar -->
<div class="h-2 w-full bg-secondary-fixed-dim"></div>
<div class="p-xl w-full flex flex-col items-center">
<!-- Large Green Success Check Icon -->
<div class="w-24 h-24 rounded-full bg-secondary-container/30 flex items-center justify-center mb-lg animate-pop relative">
<!-- Inner circle for extra depth -->
<div class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[48px] text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Sparkles effect -->
<span class="material-symbols-outlined text-secondary-fixed-dim absolute -top-1 -right-1 text-[20px] animate-pulse">arrow_back_ios_new</span>
<span class="material-symbols-outlined text-secondary-fixed-dim absolute -bottom-2 -left-2 text-[16px] animate-pulse delay-75">arrow_back_ios_new</span>
</div>
<!-- Greetings & Primary Text -->
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs tracking-tight">¡Hola, Juan!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">
                Asistencia registrada correctamente
            </p>
<!-- Details Box -->
<div class="w-full bg-surface-container rounded-lg p-md mb-xl flex flex-col gap-md border border-outline-variant/50 shadow-sm">
<div class="flex flex-row items-center justify-between">
<!-- Time -->
<div class="flex items-center gap-sm text-on-surface">
<span class="material-symbols-outlined text-outline">schedule</span>
<span class="font-body-md text-body-md text-on-surface-variant">Hora de registro:</span>
<strong class="font-label-md text-label-md text-on-surface">09:03</strong>
</div>
<!-- Status Badge -->
<div class="bg-secondary-container px-sm py-[2px] rounded-full flex items-center gap-xs border border-secondary-fixed-dim/50 shadow-sm">
<span class="material-symbols-outlined text-[14px] text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
<span class="font-label-sm text-label-sm text-on-secondary-container tracking-wider">PRESENTE</span>
</div>
</div>
</div>
<!-- Motivational Text -->
<div class="w-full bg-primary-fixed/40 px-lg py-md rounded-lg mb-xl border border-primary-fixed-dim/30">
<p class="font-body-md text-body-md text-primary font-medium flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
                    "¡Que tengas una excelente clase de computación!"
                </p>
</div>
<!-- Primary Action Button (Optional contextual return) -->
<button class="w-full bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md h-12 rounded-lg transition-all shadow-sm focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface active:scale-[0.98] flex items-center justify-center gap-sm">
<span>Ir al Tablero</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="mt-md text-on-surface-variant font-label-sm text-label-sm hover:text-primary transition-colors underline decoration-outline-variant hover:decoration-primary underline-offset-4">
                Cerrar sesión
            </button>
</div>
</main>
