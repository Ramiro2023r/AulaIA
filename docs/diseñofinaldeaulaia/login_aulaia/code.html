<style>
        /* Ambient SaaS Background Orbs */
        .ambient-orb {
            position: absolute;

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Decorative Background Elements -->
<div class="ambient-orb bg-primary-container w-[400px] h-[400px] top-[-100px] left-[-100px]"></div>
<div class="ambient-orb bg-surface-variant w-[500px] h-[500px] bottom-[-150px] right-[-100px]" style="animation-delay: -5s;"></div>
<div class="ambient-orb bg-surface-dim w-[300px] h-[300px] top-[20%] right-[10%]" style="animation-delay: -10s; opacity: 0.3;"></div>
<!-- Main Login Card -->
<main class="bg-surface-container-lowest w-full max-w-md rounded-xl shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] border border-outline-variant p-xl relative z-10 mx-container-margin flex flex-col backdrop-blur-sm">
<!-- Header -->
<header class="flex flex-col items-center mb-xl">
<div class="flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-primary text-[40px] mr-sm" style="font-variation-settings: 'FILL' 1;">psychology</span>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary tracking-tight">AulaIA</h1>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface text-center">Bienvenido nuevamente</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-sm">Ingrese sus credenciales para acceder al portal.</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Usuario Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="usuario">Usuario</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant pointer-events-none">person</span>
<input class="w-full h-[48px] rounded-DEFAULT border border-outline-variant bg-surface-container-lowest pl-[48px] pr-md font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline" id="usuario" name="usuario" placeholder="Ingrese su usuario" required="" type="text"/>
</div>
</div>
<!-- Contraseña Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="contrasena">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant pointer-events-none">lock</span>
<input class="w-full h-[48px] rounded-DEFAULT border border-outline-variant bg-surface-container-lowest pl-[48px] pr-md font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline" id="contrasena" name="contrasena" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-sm">
<!-- Recordarme Checkbox (Ensure adequate touch target) -->
<label class="flex items-center group cursor-pointer min-h-[44px] min-w-[44px]">
<div class="relative flex items-center justify-center mr-sm">
<input class="peer appearance-none w-5 h-5 border border-outline-variant rounded-DEFAULT checked:bg-primary checked:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors cursor-pointer bg-surface-container-lowest" id="recordarme" name="recordarme" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[16px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant select-none group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors min-h-[44px] flex items-center" href="#">¿Olvidó su contraseña?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] mt-sm bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center hover:bg-[#003ea8] active:bg-[#003082] transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 shadow-sm" type="submit">
                Iniciar sesión
            </button>
</form>
<!-- Footer / Support -->
<div class="mt-xl pt-lg border-t border-outline-variant/30 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">help</span>
