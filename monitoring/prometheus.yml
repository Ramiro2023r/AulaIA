global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aulaia'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot Actuator / Prometheus endpoint
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  # FastAPI (si expone /metrics)
  - job_name: 'fastapi'
    static_configs:
      - targets: ['fastapi:8000']

  # Node Exporter (métricas de sistema)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # cAdvisor (métricas de contenedores)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']

  # Traefik
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  # PostgreSQL (via postgres_exporter si se usa)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']