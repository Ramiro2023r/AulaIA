name: CI - Pull Request Validation

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Backend Tests ─────────────────────────────────────────────────────
  backend-test:
    name: Backend - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: ./mvnw test -q
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Build JAR
        run: ./mvnw package -DskipTests -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ─── Frontend Tests ────────────────────────────────────────────────────
  frontend-test:
    name: Frontend - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true

      - name: Build production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── FastAPI Tests ─────────────────────────────────────────────────────
  fastapi-test:
    name: FastAPI - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./data-science

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: data-science/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest app/tests/ -v --tb=short

  # ─── Docker Build (PR validation) ──────────────────────────────────────
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, fastapi-test]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: aulaia-backend:pr-${{ github.event.number }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build fastapi image
        uses: docker/build-push-action@v5
        with:
          context: ./data-science
          push: false
          tags: aulaia-fastapi:pr-${{ github.event.number }}
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: aulaia-frontend:pr-${{ github.event.number }}
          load: true

  # ─── Integration Test (optional, on PR) ───────────────────────────────
  integration-test:
    name: Integration - Testcontainers
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aulaia_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d aulaia_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: ./mvnw test -Dspring.profiles.active=testcontainers -q
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aulaia_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_pass
          JWT_SECRET: test-secret-key-for-integration-tests-only-32chars-minimum

  # ─── Summary ──────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, fastapi-test, docker-build, integration-test]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Backend: ${{ needs.backend-test.result }}"
          echo "Frontend: ${{ needs.frontend-test.result }}"
          echo "FastAPI: ${{ needs.fastapi-test.result }}"
          echo "Docker: ${{ needs.docker-build.result }}"
          echo "Integration: ${{ needs.integration-test.result }}"
          if [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-test.result }}" != "success" ]] || \
             [[ "${{ needs.fastapi-test.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi