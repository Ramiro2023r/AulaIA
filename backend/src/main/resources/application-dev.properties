# ============================================
# AulaIA — Perfil de desarrollo (dev)
# ============================================
# Preparado para PostgreSQL local mediante variables de entorno:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
#
# Los valores por defecto son SOLO para desarrollo local. Nunca
# escribir contraseñas reales en este archivo.

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aulaia_db}
spring.datasource.username=${DB_USERNAME:aulaia_user}
spring.datasource.password=${DB_PASSWORD:}

# JPA y Flyway: validación de esquema y migraciones versionadas
# (docs/03-ARQUITECTURA, docs/04-BASE_DE_DATOS).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT: el secreto viene SOLO de la variable JWT_SECRET (>= 32 caracteres).
# Sin fallback: si no se define, JwtService falla al arrancar (fail fast).
jwt.secret=${JWT_SECRET:}

# FastAPI IA Service (Prompt 16.5)
# URL base del servicio de análisis (Docker: http://fastapi:8000)
aulaia.fastapi.base-url=${IA_SERVICE_URL:http://localhost:8000}
aulaia.fastapi.connect-timeout=5s
aulaia.fastapi.read-timeout=30s

# NOTA: este perfil no arrancará por completo hasta que PostgreSQL y las
# migraciones existan (Prompt 1.3). No crear tablas manualmente.
# Ejecución: $env:SPRING_PROFILES_ACTIVE="dev"; .\mvnw.cmd spring-boot:run