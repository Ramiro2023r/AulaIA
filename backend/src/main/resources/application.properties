# ============================================
# AulaIA — Backend Spring Boot
# Configuración base (común a todos los perfiles)
# ============================================
# Referencia: /docs (fuente oficial del proyecto)
# No colocar credenciales ni secretos aquí.

spring.application.name=aulaia-backend

# Puerto HTTP; en producción lo define la variable PORT.
server.port=${PORT:8080}

# Zona horaria oficial del sistema (docs/04-BASE_DE_DATOS)
spring.jackson.time-zone=America/Lima

# Evita mantener abierta la sesión de Hibernate durante el renderizado
spring.jpa.open-in-view=false

# Actuator: exponer únicamente el endpoint de salud.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Springdoc OpenAPI 3 + Swagger UI (docs/03-ARQUITECTURA #39).
# Habilitado por defecto para desarrollo y pruebas; en prod se deshabilita
# salvo que la configuración externa lo active (application-prod.properties).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# JWT (Prompt 2.3): expiración del token en MILISEGUNDOS.
# 3600000 ms = 1 hora. Sobrescribible con la variable JWT_EXPIRATION.
# El secreto (jwt.secret / JWT_SECRET) se define por perfil; nunca en el repo.
jwt.expiration-ms=${JWT_EXPIRATION:3600000}

# Bootstrap del administrador inicial (Prompt 2.6): crea el PRIMER ADMIN
# de una instalación solo si se habilita explícitamente. Deshabilitado por
# defecto en TODOS los perfiles (dev, test, prod). Username y password
# vienen EXCLUSIVAMENTE del entorno (sin fallback real: vacío). Si el
# bootstrap está habilitado y las variables son inválidas, el arranque falla.
aulaia.bootstrap.admin.enabled=${AULAIA_BOOTSTRAP_ADMIN_ENABLED:false}
aulaia.bootstrap.admin.username=${AULAIA_BOOTSTRAP_ADMIN_USERNAME:}
aulaia.bootstrap.admin.password=${AULAIA_BOOTSTRAP_ADMIN_PASSWORD:}

# Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.enabled=${TELEGRAM_ENABLED:false}