# ============================================
# AulaIA — Perfil de prueba (test)
# ============================================
# Pruebas automatizadas sin depender de PostgreSQL externo.
#
# ESTRATEGIA TEMPORAL (Prompt 1.2): se excluye únicamente la
# auto-configuración de DataSource; JPA y Flyway retroceden automáticamente
# al no existir una fuente de datos. Es la solución mínima necesaria
# mientras no existen entidades ni repositorios funcionales.
#
# Se reemplazará por PostgreSQL real vía Testcontainers cuando el contexto
# de prueba lo requiera (Sprint 18 — Testing integral). No se introduce
# H2 porque no está justificado por la arquitectura.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# JWT SOLO PARA PRUEBAS: secreto ficticio, identificado como test.
# Nunca usar en dev/prod; no es una credencial real (Prompt 2.3).
jwt.secret=test-only-secret-aulaia-para-pruebas-99caracteres-no-usar-prod