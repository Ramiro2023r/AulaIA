# ============================================
# AulaIA — Perfil de producción (prod)
# ============================================
# Producción usa EXCLUSIVAMENTE configuración externa (variables de
# entorno o secretos del proveedor de hosting). Sin valores por defecto:
# si falta una variable, el arranque falla (comportamiento deseado).
# No usar "localhost" como valor obligatorio de producción.
#
# Variables requeridas:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD,
#   JWT_SECRET, IA_SERVICE_URL

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA y Flyway: validación de esquema y migraciones versionadas.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Secretos consumidos por código en sprints posteriores (sin defaults):
#   JWT_SECRET      -> Sprint 2 (firma de tokens JWT)
#   IA_SERVICE_URL  -> Sprint 16 (cliente HTTP del servicio FastAPI)

# JWT: SECRETO OBLIGATORIO en producción. Sin fallback inseguro: si falta
# JWT_SECRET (o es < 32 caracteres), el backend no inicia (fail fast).
jwt.secret=${JWT_SECRET}
# Solo se expone si la configuración externa del hosting lo habilita
# explícitamente (SPRINGDOC_API_DOCS_ENABLED / SPRINGDOC_SWAGGER_UI_ENABLED).
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Bootstrap del administrador inicial (Prompt 2.6): en producción la
# variable base lo deja DESHABILITADO por defecto. Solo se activa de forma
# explícita con AULAIA_BOOTSTRAP_ADMIN_ENABLED=true, y la contraseña
# (AULAIA_BOOTSTRAP_ADMIN_PASSWORD) debe venir obligatoriamente del entorno
# del hosting (sin fallback real). Recomendado solo para el primer arranque.