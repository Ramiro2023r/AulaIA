# ============================================
# AulaIA — Perfil de integración (itest)
# ============================================
# PERFIL OPCIONAL, SOLO para ejecutar pruebas de repositorio contra
# PostgreSQL real local (p. ej. UsuarioRepositoryTest).
#
# Deshabilitado por defecto (las pruebas usan @EnabledIfSystemProperty
# con -Daulaia.itest=true) para que `mvn test` no dependa de una
# instalación PostgreSQL personal. Se reemplazará por Testcontainers
# en el Sprint 18 (Testing integral).
#
# Requiere las mismas variables de entorno que dev:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aulaia_db}
spring.datasource.username=${DB_USERNAME:aulaia_user}
spring.datasource.password=${DB_PASSWORD:}

# Validación del esquema contra las migraciones (nunca update/create).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Documentación y salud innecesarias en pruebas de integración.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false