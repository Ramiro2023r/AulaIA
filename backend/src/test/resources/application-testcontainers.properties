# ============================================
# AulaIA — Perfil Testcontainers (testcontainers)
# ============================================
# Usa PostgreSQL real vía Testcontainers para tests de integración.
# Se activa con: -Dspring.profiles.active=testcontainers
# o extendiendo TestcontainersConfig en la clase de test.
# ============================================

# Las propiedades DB_* se inyectan dinámicamente desde TestcontainersConfig
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aulaia_test}
spring.datasource.username=${DB_USERNAME:test_user}
spring.datasource.password=${DB_PASSWORD:test_pass}

# Validación del esquema contra las migraciones Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT secret para tests (dummy, no usar en producción)
jwt.secret=test-secret-key-for-integration-tests-only-32chars-minimum

# Deshabilitar docs/swagger en tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging reducido para tests
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN